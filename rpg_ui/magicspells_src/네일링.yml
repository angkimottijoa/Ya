네일링RC리프2:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 20
    upward-velocity: -3
    rotation: 0
    add-velocity-instead: true
    cancel-damage: false
    client-only: false
    land-spell: [<spell>]

