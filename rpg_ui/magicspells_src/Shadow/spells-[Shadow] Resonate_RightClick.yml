Shadow_Resonate_RightClick_M:
    spell-class: ".MultiSpell"
    str-on-cooldown: "&f[ &5&l&5&l\uADF8\uB9BC\uC790 &f] &4&l\uADF8\uB9BC\uC790\uAC80\uC220 &f&l\uCFE8\uD0C0\uC784\uC774 &b&l%c&l&f\uCD08 &a&l\uB0A8\uC558\uC2B5\uB2C8\uB2E4"
    cooldown: 5
    modifiers:
        - sneaking denied
        - buffactive Shadow_Other_Self_Buff required
    spells:
        - Shadow_Resonate_RightClick_Up_Leap
        - DELAY 6
        - Shadow_Resonate_RightClick_Dash_Leap
        - Shadow_Resonate_RightClick_Dash_Effect
        - DELAY 18
        - Shadow_Resonate_RightClick_Slash_Effect
        - Shadow_Resonate_RightClick_Slash_Area
        - DELAY 3
        - Shadow_Resonate_RightClick_Slash_Area
    effects:
      1:
        position: caster
        effect: sound
        sound: entity.ghast.shoot
        volume: 1
        pitch: -2
      2:
        position: caster
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 0.12
        delay: 10
      3:
        position: caster
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 0.12
        delay: 15
      4:
        position: caster
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 0.12
        delay: 18
      5:
        position: caster
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 0.12
        delay: 20

Shadow_Resonate_RightClick_Up_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: 6
    cancel-damage: true

Shadow_Resonate_RightClick_Dash_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 25
    upward-velocity: 3
    cancel-damage: true

Shadow_Resonate_RightClick_Slash_Effect:
    spell-class: ".instant.ParticleProjectileSpell"
    projectile-velocity: 0
    projectile-gravity: 0
    projectile-horiz-offset: 0
    projectile-vert-offset: 0
    particle-name: take
    particle-speed: 0
    particle-count: 0
    particle-horizontal-spread: 0
    particle-vertical-spread: 0
    special-effect-interval: 1
    tick-interval: 1
    max-distance: 0
    max-duration: 0
    hit-players: true
    hit-non-players: true
    hit-air-at-end: true
    start-forward-offset: 0
    start-y-offset: 0
    hit-radius: 1.5
    vertical-hit-radius: 1.5
    stop-on-hit-entity: false
    stop-on-hit-ground: false
    spell: Shadow_Dummy
    effects:
      EFF1:
        position: special
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "0.2cos(2t)-2.5cos(0.02t)"
            yEquation: "3sin(0.015t)"
            zEquation: "0.2sin(2t)-2.5sin(0.02t)"
            particle: reddust
            color: 6E2FC7
            duration: 200
            particles: 60
            cycle: false
            orient: true
            orientPitch: false
      EFF2:
        position: special
        rotate: 90
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "0.2cos(2t)-2.5cos(0.02t)"
            yEquation: "3sin(0.015t)"
            zEquation: "-0.2sin(2t)+2.5sin(0.02t)"
            particle: reddust
            color: 6E2FC7
            duration: 200
            particles: 60
            cycle: false
            orient: true
            orientPitch: false

Shadow_Resonate_RightClick_Dash_Effect:
    spell-class: ".instant.ParticleProjectileSpell"
    projectile-velocity: 0
    projectile-gravity: 0
    projectile-horiz-offset: 0
    projectile-vert-offset: 0
    particle-name: take
    particle-speed: 0
    particle-count: 0
    particle-horizontal-spread: 0
    particle-vertical-spread: 0
    special-effect-interval: 1
    tick-interval: 1
    max-distance: 0
    max-duration: 0
    hit-players: true
    hit-non-players: true
    hit-air-at-end: true
    start-forward-offset: 0
    start-y-offset: 0
    hit-radius: 1.5
    vertical-hit-radius: 1.5
    stop-on-hit-entity: false
    stop-on-hit-ground: false
    spell: Shadow_Dummy
    effects:
      EFF1:
        position: caster
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "(0.03t) + 3sin(0.02t)"
            yEquation: "0.2cos(2t)-2cos(0.02t)"
            zEquation: "0.2sin(2t)-2sin(0.02t)"
            particle: spell_instant
            duration: 600
            particles: 60
            color: fffff
            cycle: false
            orient: true
            orientPitch: false
      EFF2:
        position: caster
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "(0.03t) - 3sin(0.02t)"
            yEquation: "0.2cos(2t)-2cos(0.02t)"
            zEquation: "0.2sin(2t)+2sin(0.02t)"
            particle: spell_witch
            duration: 600
            particles: 60
            color: fffff
            cycle: false
            orient: true
            orientPitch: false

Shadow_Resonate_RightClick_Slash_Area:
    spell-class: ".targeted.AreaEffectSpell"
    horizontal-radius: 5
    vertical-radius: 5
    point-blank: true
    fail-if-no-targets: false
    spell-source-in-center: true
    max-targets: 999
    can-target: players, nonplayers
    spells:
        - Shadow_Resonate_RightClick_Slash_Damage

Shadow_Resonate_RightClick_Slash_Damage:
    spell-class: ".targeted.PainSpell"
    ignore-armor: true
    damage: 20

