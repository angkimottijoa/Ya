Shadow_ShiftL_M:
    spell-class: ".MultiSpell"
    cast-item: Shadow
    str-on-cooldown: "&f[ &5&l&5&l\uADF8\uB9BC\uC790 &f] &7&l\uADF8\uB9BC\uC790\uC218\uB9AC\uAC80 &f&l\uCFE8\uD0C0\uC784\uC774 &b&l%c&l&f\uCD08 &a&l\uB0A8\uC558\uC2B5\uB2C8\uB2E4"
    cooldown: 30
    modifiers:
        - sneaking required
    spells:
        - Shadow_ShiftL_Up_Leap
        - DELAY 20
        - Shadow_ShiftL_Dagger_DownPP
        - Shadow_ShiftL_Invisible
        - Shadow_ShiftL_BackStep_Leap
    effects:
      1:
        position: caster
        effect: sound
        sound:  entity.wither.spawn
        volume: 1
        pitch: 2
      2:
        position: caster
        effect: sound
        sound:  entity.wither.death
        volume: 2
        pitch: 1.75
        delay: 20
      3:
        delay: 20
        position: caster
        effect: particles
        particle-name: largesmoke
        horiz-spread: 3
        vert-spread: 2
        count: 300
        speed: 0.1
      4:
        delay: 20
        position: caster
        effect: particles
        particle-name: endRod
        horiz-spread: 3
        vert-spread: 2
        count: 150
        speed: 1
      5:
        delay: 20
        position: caster
        effect: particles
        particle-name: witchMagic
        horiz-spread: 3
        vert-spread: 2
        count: 300
        speed: 0.1

Shadow_ShiftL_Invisible:
    spell-class: ".targeted.PotionEffectSpell"
    cooldown: 0
    always-granted: true
    type: 14
    strength: 0
    duration: 200
    targeted: false
    can-target: self

Shadow_ShiftL_Up_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: 15
    cancel-damage: true
    effects:
      EF3:
        position: caster
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "1cos(2t)-6cos(0.02t)"
            yEquation: "0.025t"
            zEquation: "1sin(2t)-6sin(0.02t)"
            particle: spell_witch
            duration: 600
            particles: 60
            cycle: false
            orient: true
            orientPitch: false
      EF4:
        position: caster
        effect: effectlib
        height-offset: 0
        delay: 0
        effectlib: 
            class: EquationEffect
            xEquation: "1sin(2t)-6sin(0.02t)"
            yEquation: "0.025t"
            zEquation: "1cos(2t)-6cos(0.02t)"
            particle: spell_instant
            duration: 600
            particles: 60
            cycle: false
            orient: true
            orientPitch: false

Shadow_ShiftL_BackStep_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: -10
    upward-velocity: 5
    cancel-damage: true

