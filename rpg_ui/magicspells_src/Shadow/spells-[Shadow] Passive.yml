===========#Passive_Night#================:

Passive_Night_Ticks:
    spell-class: ".PassiveSpell"
    triggers:
        - ticks 20
    modifiers:
        - night required
        - holding 272 required
        - variablelessthan shadow:100 required
    spells: 
        - Passive_Night_Ticks_Dummy
    effects:
      1:
        position: caster
        effect: sound
        sound:  entity.ghast.shoot
        volume: 0.5
        pitch: 0.1
      2:
        position: caster
        effect: particles
        particle-name: largesmoke
        horiz-spread: 1
        vert-spread: 0.05
        count: 30
        speed: 0.1
        y-offset: 0.05
      3:
        position: caster
        effect: particles
        particle-name: witchMagic
        horiz-spread: 1
        vert-spread: 0.05
        count: 30
        speed: 0.1
        y-offset: 0.05

Passive_Night_Ticks_Dummy:
    spell-class: ".instant.DummySpell"
    always-granted: true
    variable-mods-cast:
        - shadow +1

