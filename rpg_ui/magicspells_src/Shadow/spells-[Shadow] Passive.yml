variables:
    shadow:
        type: player
        default: 0
        min: 0
        max: 100
        permanent: true
    shadow_armor:
        type: player
        default: 0
        min: 0
        max: 20
        permanent: false

Shadow_Force_Add_Dummy:
    spell-class: ".instant.DummySpell"
    incantations:
        - /ShadowAdd
    always-granted: true
    str-cast-self: "&f[ &5&l\uADF8\uB9BC\uC790 &f] &f&l\uD604\uC7AC &5&l\uADF8\uB9BC\uC790 &7&l\uC911\uCCA9 &0&l[&f&l%var:shadow:0%&7/&f&l100&0&l]"
    variable-mods-cast:
        - shadow +100

Shadow_Force_Remove_Dummy:
    spell-class: ".instant.DummySpell"
    incantations:
        - /ShadowRemove
    always-granted: true
    str-cast-self: "&f[ &5&l\uADF8\uB9BC\uC790 &f] &f&l\uD604\uC7AC &5&l\uADF8\uB9BC\uC790 &7&l\uC911\uCCA9 &0&l[&f&l%var:shadow:0%&7/&f&l100&0&l]"
    variable-mods-cast:
        - shadow -100

Shadow_DoubleShift_BuffDummy:
    spell-class: ".buff.DummySpell"
    duration: 0.2

Shadow_DoubleShift_Passive1:
    spell-class: ".PassiveSpell"
    triggers:
        - stopsneak
    modifiers:
        - holding 272 required
    spells: 
        - Shadow_DoubleShift_BuffDummy

Shadow_DoubleShift_Passive2:
    spell-class: ".PassiveSpell"
    triggers:
        - sneak
    modifiers:
        - buffactive Shadow_DoubleShift_BuffDummy required
    spells: 
        - Shadow_DoubleShift_Ex

Shadow_DoubleShift_Ex:
    spell-class: ".ExternalCommandSpell"
    cooldown: 0
    command-to-execute: 
        - "c Shadow_DoubleShift_Check_Variable"

Shadow_DoubleShift_Check_Variable:
    spell-class: ".instant.DummySpell"
    always-granted: true
    str-cast-self: "&f[ &5&l\uADF8\uB9BC\uC790 &f] &f&l\uD604\uC7AC &5&l\uADF8\uB9BC\uC790 &7&l\uC911\uCCA9 &0&l[&f&l%var:shadow:0%&7/&f&l100&0&l]"

