#무지개떡볶이 만듬 2차수정은 가능하지만 2차배포는 안됩니다.

predefined-items: 
    도사: 
        type: "268:1" 
        name: '&f도사의 &7부채'
        lore:
          - "&f설명 넣어주시고 밑에거는 지우셔도 됩니다!"
          - "&8made by 무지개떡볶이"
        unbreakable: true
        attributes:   
            attr1: "generic.attackDamage 10 add mainhand"
            
#---쉬프트 + 쉬프트---#

도사_SS_passive1:
    spell-class: ".PassiveSpell"
    always-granted: true
    triggers:
        - stopsneak
    modifiers:
        - holding 268:1 required
    spells:
        - 도사_SS_dummy

도사_SS_dummy:    
    spell-class: ".buff.DummySpell"     
    duration: 0.5

도사_SS_passive2:
    spell-class: ".PassiveSpell"
    always-granted: true
    triggers:
        - sneak
    modifiers:
        - holding 268:1 required
        - buffactive 도사_SS_dummy required
    spells:
        - 도사_SS_Invisibility(mode=full)
    send-failure-messages: true
        
도사_SS_Invisibility: 
    spell-class: ".buff.InvisibilitySpell"
    cooldown: 240
    toggle: false
    prevent-pickups: flase
    cancel-on-give-damage: true
    cancel-on-logout: true
    cancel-on-spell-cast: false
    duration: 10
    str-fade: "&f《 도사 》 은신이 해제되었습니다."
    effects:
      1:
        effect: particles
        position: caster
        particle-name: cloud
        speed: 0.1
        count: 20
        horiz-spread: 1
        vert-spread: 1
        forward-offset: 0
        y-offset: 1
      2:
        effect: particles
        position: disabled
        particle-name: cloud
        speed: 0.5
        count: 15
        horiz-spread: 0.5
        vert-spread: 0.5
        forward-offset: 0
        y-offset: 1
      3:
        effect: particles
        position: disabled
        particle-name: blockdust_95_0
        speed: 0.5
        count: 15
        horiz-spread: 0.5
        vert-spread: 0.5
        forward-offset: 0
        y-offset: 1
      s1:
        position: caster
        effect: sound
        sound: entity.zombie_villager.converted
        volume: 1
        pitch: 2
      s2:
        position: disabled
        effect: sound
        sound: entity.zombie_villager.remedy
        volume: 0.5
        pitch: 2
      s3:
        position: disabled
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 1
        
#---패시브---#

도사_P_passive:
    spell-class: ".PassiveSpell"
    always-granted: true
    triggers:
        - kill
    modifiers:
        - hasitem 268:1 required
    spells:
        - 도사_P_Potion
        
도사_P_Potion:    
    spell-class: ".targeted.PotionEffectSpell"
    type: 5
    strength: 1
    duration: 60
    targeted: false
    effects:
      1:
        position: caster
        effect: effectlibentity
        effectlib:
            class: EquationEffect
            xEquation: "1.5cos(0.1t)"
            yEquation: "0.1"
            zEquation: "1.5sin(0.1t)"
            duration: 3000
            particle: CLOUD
            particles: 10
            cycle: false
            color: FF0000
            speed: 0.05
            orient: true
            orientPitch: false
            
#---우클릭---#

도사_R_M:
    spell-class: ".MultiSpell" 
    always-granted: true  
    right-click-cast-item: 도사
    modifiers:
        - sneaking castinstead 도사_SR_M
    cooldown: 10
    spells:
        - 도사_R_pp
    effects:
      1:
        position: caster
        effect: effectlib
        effectlib:
            class: EquationEffect
            xEquation: "sin(0.02t)rand(-4,4) + 6sin(0.02t)"
            yEquation: "1"
            zEquation: "cos(0.02t)rand(-4,4) + 6cos(0.02t)"
