            particle: CLOUD
            particles: 40
            cycle: false
            color: FF0000
            speed: 0.1
            orient: true
            orientPitch: true
      s1:
        position: caster
        effect: sound
        sound: entity.wither.shoot
        volume: 1
        pitch: 0.6
      s2:
        position: caster
        effect: sound
        sound: entity.bat.takeoff
        volume: 2
        pitch: 0
      s3:
        position: caster
        effect: sound
        sound: entity.zombie_villager.cure
        volume: 1
        pitch: 2
        
도사_R_pp:
    spell-class: ".instant.ParticleProjectileSpell"
    projectile-velocity: 3
    projectile-horiz-offset: 0
    projectile-vert-offset: 0
    projectile-gravity: 0
    particle-name: take
    particle-count: 0
    particle-speed: 0
