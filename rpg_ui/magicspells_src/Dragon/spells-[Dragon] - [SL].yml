Dragon_SL_ForceToss_First:
    spell-class: ".targeted.ForcetossSpell"
    horizontal-force: 0
    vertical-force: 10
    can-target: players,monsters,nonplayers
    cancel-damage: true
    effects:
      0: 
        position: target
        delay: 15
        effect: effectlib 
        effectlib: 
            class: SphereEffect
            particle: redstone
            color: 0054FF
            radius: 1.5
            particles: 10
            iterations: 100
            period: 1
            duration: 2000
            relativeOffset: 0,1,0
      1: 
        position: target
        delay: 15
        effect: effectlib 
        effectlib: 
            class: SphereEffect
            particle: redstone
            color: FFFFFF
            radius: 1.5
            particles: 5
            iterations: 100
            period: 1
            duration: 2000
            relativeOffset: 0,1,0
