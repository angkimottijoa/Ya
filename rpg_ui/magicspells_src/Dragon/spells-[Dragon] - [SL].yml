Dragon_L_Ex:
    spell-class: ".ExternalCommandSpell"
    cast-item: DragonAxe
    always-granted: true
    command-to-execute: 
        - "c Dragon_ShiftL_L_M"
        - "c Dragon_ShiftL_M"

Dragon_ShiftL_L_M:
    spell-class: ".MultiSpell"
    modifiers:
        - sneaking denied
        - buffactive Dragon_SL_Air_Dummy required
    spells:
        - Dragon_SL_Air_Dummy
        - DELAY 5
        - Dragon_SL_Ground_Dummy
        - Dragon_SL_Velocity
    effects:
      1:
        position: caster
        effect: sound
        sound: entity.irongolem.death
        volume: 2
        pitch: 0.1
        delay: 0
      2:
        position: caster
        effect: sound
        sound: entity.irongolem.death
        volume: 2
        pitch: 2
        delay: 5

Dragon_ShiftL_M:
    spell-class: ".MultiSpell"
    cooldown: 60
    modifiers:
        - sneaking required
        - buffactive Dragon_SL_Air_Dummy denied
    str-on-cooldown: "&f[ &b&lMagicSpells &f] &c&l\uC26C\uD504\uD2B8\uC88C\uD074\uB9AD &f&l\uCFE8\uD0C0\uC784\uC774 &b&l%c&l&f\uCD08 &a&l\uB0A8\uC558\uC2B5\uB2C8\uB2E4"
    always-granted: true
    spells:
        - Dragon_SL_Leap
        - Dragon_SL_ShapeAxe_1_Dummy
        - Dragon_Passsive_ShiftL_Dummy
        - DELAY 25
        - Dragon_SL_Air_Dummy_Ex
        - Dragon_SL_ShapeAxe_1_Dummy
        - Dragon_SL_ShapeAxe_2_Dummy

Dragon_SL_Air_Dummy_Ex:
    spell-class: ".ExternalCommandSpell"
    always-granted: true
    command-to-execute: 
        - "c Dragon_SL_Air_Dummy"

Dragon_ShiftL_Passive_Air_Sound:
    spell-class: ".PassiveSpell"
    triggers:
        - ticks 20
    modifiers:
        - buffactive Dragon_SL_Air_Dummy required
    spells: 
        - Dragon_Mark_Dummy
    effects:
      1:
        position: caster
        effect: sound
        sound:  entity.experience_orb.pickup
        volume: 1
        pitch: 0.89

Dragon_ShiftL_Passive_Air:
    spell-class: ".PassiveSpell"
    triggers:
        - ticks 1
    modifiers:
        - buffactive Dragon_SL_Air_Dummy required
    spells: 
        - Dragon_SL_Leap_Air_Set
    effects:
      0:
        position: caster
        effect: title
        title: "&f[ &b&lSystem &f]"
        subtitle: "&f[ &c&l\uC88C\uD074\uB9AD\uC2DC \uBC14\uB77C\uBCF4\uB294 \uBC29\uD5A5\uC73C\uB85C \uB3CC\uC9C4\uD569\uB2C8\uB2E4! &f]"
        fade-in: 1
        stay: 5
        fade-out: 1

Dragon_SL_Ground_Dummy:
    spell-class: ".buff.DummySpell"
    always-granted: true
    duration: 15

Dragon_SL_Velocity:
  spell-class: ".instant.VelocitySpell"
  speed: 5

Dragon_SL_Air_Dummy:
    spell-class: ".buff.DummySpell"
    always-granted: true
    duration: 10
    str-cast-self: "&f&l[ &b&lSystem &f] &c&l10\uCD08 \uB0B4\uB85C \uC0AC\uC6A9\uD558\uC9C0 \uC54A\uC73C\uBA74 \uC2A4\uD0AC \uC0AC\uC6A9\uC774 \uCDE8\uC18C\uB429\uB2C8\uB2E4."

Dragon_SL_Leap_Air_Set:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: 0.55
    cancel-damage: true

Dragon_SL_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: 25
    cancel-damage: true
    effects:
      1[S]:
        position: caster
        effect: sound
        sound:  entity.enderdragon.growl
        volume: 3
        pitch: 0.89
        delay: 0
      Effectlib_1:
        delay: 1
        position: caster
        effect: effectlib
        effectlib: 
            class: EquationEffect
            xEquation: "4sin(0.04t)+4cos(0.04t)"
            yEquation: "0.04t"
            zEquation: "4cos(0.04t)-4sin(0.04t)"
            particle: explosion_large
            duration: 1000
            particles: 40
            cycle: false
            orient: true
            orientPitch: false
      Effectlib_2:
        delay: 1
        position: caster
        effect: effectlib
        effectlib: 
            class: EquationEffect
            xEquation: "4sin(0.04t)+4cos(0.04t)"
            yEquation: "0.04t"
            zEquation: "4cos(0.04t)-4sin(0.04t)"
            particle: cloud
            duration: 1000
            particles: 40
            speed: 1
            cycle: false
            orient: true
            orientPitch: false

