Dragon_R_Ex:
    spell-class: ".ExternalCommandSpell"
    right-click-cast-item: DragonAxe
    always-granted: true
    command-to-execute: 
        - "c Dragon_R_TM"
        - "c Dragon_ShiftR_M"

Dragon_R_TM:
    spell-class: ".TargetedMultiSpell"
    always-granted: true
    modifiers:
        - sneaking denied
    target-modifiers:
        - potioneffect 2 required
        - potioneffect 13 required
    range: 13
    can-target: players, nonplayers
    require-entity-target: true
    always-granted: true
    cooldown: 20
    str-no-target: "&f[ &b&lMagicSpells &f] &f&l\uB300\uC0C1\uC5D0\uAC8C &1&l\uC6A9&f&l\uC758&b&l\uD45C\uC2DD&f&l\uC774 &c&l\uC0C8\uACA8\uC9C0\uC9C0 \uC54A\uC558\uAC70\uB098 \uB108\uBB34 \uBA40\uB9AC \uC788\uC2B5\uB2C8\uB2E4!"
    str-on-cooldown: "&f[ &b&lMagicSpells &f] &c&l\uC6B0\uD074\uB9AD &f&l\uCFE8\uD0C0\uC784\uC774 &b&l%c&l&f\uCD08 &a&l\uB0A8\uC558\uC2B5\uB2C8\uB2E4"
    no-target: false
    spells:
        - Dragon_R_TM_ShadowStep
        - Dragon_R_ForceToss
        - DELAY 25
        - Dragon_R_ForceToss2

Dragon_R_Airbone_Dummy:
    spell-class: ".buff.DummySpell"
    always-granted: true
    duration: 5

Dragon_R_TM_ShadowStep_Passive:
    spell-class: ".PassiveSpell"
    triggers:
        - spellcast Dragon_R_TM_ShadowStep
    modifiers:
        - holding 279 required
    spells: 
        - Dragon_Passsive_R_Dummy
        - Dragon_R_Leap_M

Dragon_R_Airbone_Passive:
    spell-class: ".PassiveSpell"
    triggers:
        - ticks 1
    modifiers:
        - buffactive Dragon_R_Airbone_Dummy required
    spells: 
        - Dragon_RightClick_Axe_Airbone

Dragon_R_Airbone_Passive2:
    spell-class: ".PassiveSpell"
    triggers:
        - ticks 1
    modifiers:
        - buffactive Dragon_R_Airbone_Dummy required
        - onblock 0 denied
    spells: 
        - Dragon_RightClick_Pain_Area
        - Dragon_R_Airbone_Dummy
        - Dragon_RightClick_Axe_Airbone_Continue
        - Dragon_Passsive_R_Dummy
    effects:
      1:
        position: caster
        effect: sound
        sound: entity.zombie_villager.cure
        volume: 1.5
        pitch: 0.8
      2:
        position: caster
        effect: sound
        sound: entity.zombie.break_door_wood
        volume: 1.5
        pitch: 0.5
      3:
        position: caster
        effect: sound
        sound: entity.generic.explode
        volume: 1.5
        pitch: 1
      4:
        position: caster
        effect: particles
        particle-name: largeexplode
        horiz-spread: 5.5
        vert-spread: 0.05
        speed: 0
        count: 50
        y-offset: 0.01
      5:
        position: caster
        effect: particles
        particle-name: lava
        horiz-spread: 5.5
        vert-spread: 0.05
        speed: 0
        count: 75
        y-offset: 0.01

Dragon_R_Leap_M:
    spell-class: ".MultiSpell"
    spells:
        - Dragon_R_Leap
        - DELAY 10
        - Dragon_R_Airbone_Dummy
        - DELAY 15
        - Dragon_R_Leap2

Dragon_R_TM_ShadowStep:
    spell-class: ".targeted.ShadowstepSpell"
    can-target: players, nonplayers
    effects:
      1:
        position: target
        effect: sound
        sound: entity.wither.spawn
        volume: 1.5
        pitch: 1
        delay: 1
      2:
        position: target
        effect: particles
        particle-name: cloud
        horiz-spread: 0.5
        vert-spread: 0.5
        speed: 0.1
        count: 100
        y-offset: 0.3
      3:
        position: target
        effect: particles
        particle-name: smoke
        horiz-spread: 0.5
        vert-spread: 0.5
        speed: 0.1
        count: 100
        y-offset: 0.3
        delay: 0
      4:
        position: target
        effect: sound
        sound: entity.irongolem.death
        volume: 1.5
        pitch: 0.1
        delay: 21
      5:
        position: target
        effect: sound
        sound: entity.irongolem.death
        volume: 1.5
        pitch: 2
        delay: 26

Dragon_R_ForceToss:
    spell-class: ".targeted.ForcetossSpell"
    horizontal-force: 0
    vertical-force: 17
    can-target: players,monsters,nonplayers
    cancel-damage: true

Dragon_R_ForceToss2:
    spell-class: ".targeted.ForcetossSpell"
    horizontal-force: 0
    vertical-force: -17
    can-target: players,monsters,nonplayers
    cancel-damage: true

Dragon_R_Leap:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: 17
    cancel-damage: true
    effects:
      Effectlib_1:
        delay: 1
        position: caster
        effect: effectlib
        effectlib: 
            class: EquationEffect
            xEquation: "4sin(0.02t)+4cos(0.02t)"
            yEquation: "0.015t"
            zEquation: "4cos(0.02t)-4sin(0.02t)"
            particle: cloud
            duration: 800
            particles: 40
            cycle: false
            orient: true
            orientPitch: false
      Effectlib_2:
        delay: 3
        position: caster
        effect: effectlib
        effectlib: 
            class: EquationEffect
            xEquation: "4sin(0.02t)+4cos(0.02t)"
            yEquation: "0.015t"
            zEquation: "4cos(0.02t)-4sin(0.02t)"
            particle: smoke_large
            duration: 800
            particles: 40
            cycle: false
            orient: true
            orientPitch: false
      Effectlib_3:
        delay: 5
        position: caster
        effect: effectlib
        effectlib: 
            class: EquationEffect
            xEquation: "4sin(0.02t)+4cos(0.02t)"
            yEquation: "0.015t"
            zEquation: "4cos(0.02t)-4sin(0.02t)"
            particle: redstone
            duration: 800
            particles: 40
            color: 0054FF
            cycle: false
            orient: true
            orientPitch: false

Dragon_R_Leap2:
    spell-class: ".instant.LeapSpell"
    forward-velocity: 0
    upward-velocity: -17
    cancel-damage: true

