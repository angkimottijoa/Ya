Dragon_ShiftR_M:
    spell-class: ".MultiSpell"
    cooldown: 120
    modifiers:
        - sneaking required
    str-on-cooldown: "&f[ &b&lMagicSpells &f] &4&l\uC26C\uD504\uD2B8\uC6B0\uD074\uB9AD &f&l\uCFE8\uD0C0\uC784\uC774 &b&l%c&l&f\uCD08 &a&l\uB0A8\uC558\uC2B5\uB2C8\uB2E4"
    always-granted: true
    spells:
        - Dragon_Mark_PP

Dragon_Mark_TM_MagicZone:
    spell-class: ".TargetedMultiSpell"
    spells:
        - Dragon_Mark_TM_MagicZone_Damage_Area_PP
        - DELAY 20
        - Dragon_Mark_TM_MagicZone_Damage_Area_PP
        - DELAY 20
        - Dragon_Mark_TM_MagicZone_Damage_Area_PP
        - DELAY 20
        - Dragon_Mark_TM_MagicZone_Damage_Area_PP
        - DELAY 20
        - Dragon_Mark_TM_MagicZone_Damage_Area_PP

Dragon_Mark_ShiftR_Pain:
    spell-class: ".targeted.PainSpell"
    ignore-armor: true
    damage: 40

Dragon_Mark_TM_MagicZone_Damage_Area_PP:
    spell-class: ".instant.ParticleProjectileSpell"
    projectile-velocity: 10
    projectile-gravity: 0
    projectile-horiz-offset: 0
    projectile-vert-offset: 0
    tick-interval: 1
    projectile-spread: 0
    special-effect-interval: 1
    particle-name: take
    particle-speed: 0
    particle-count: 1
    particle-horizontal-spread: 0.01
    particle-vertical-spread: 0.01
    max-distance: 1
    max-duration: 10
    start-y-offset: 1
    start-forward-offset: -0.75
    hit-air-during: true
    spell-interval: 1
    hit-radius: 1
    hit-players: false
    hit-non-players: false
    stop-on-hit-entity: false
    stop-on-hit-ground: false
    spell: Dragon_Mark_TM_MagicZone_Damage_Area_PP_Area
    effects:
      1:
        position: special
        effect: particles
        particle-name: cloud
        horiz-spread: 5.5
        vert-spread: 0.05
        speed: 0.1
        count: 50
        y-offset: -4
      2:
        position: special
        effect: particles
        particle-name: fireworksSpark
        horiz-spread: 5.5
        vert-spread: 0.05
        speed: 0.1
        count: 50
        y-offset: -4

Dragon_Mark_TM_MagicZone_Damage_Area_PP_Area:
    spell-class: ".targeted.AreaEffectSpell"
    horizontal-radius: 15
    vertical-radius: 15
    point-blank: true
    fail-if-no-targets: false
    spell-source-in-center: true
    max-targets: 999
    can-target: players, nonplayers
    spells:
        - Dragon_Mark_TM_MagicZone_Area_TmAny

Dragon_Mark_TM_MagicZone_Area_TmAny:
    spell-class: ".TargetedMultiSpell"
    spells:
        - Dragon_Mark_ShiftR_Pain
        - Dragon_Mark_TM_MagicZone_Wither
        - Dragon_Mark_TM_MagicZone_Area_Blindness
        - Dragon_Mark_TM_MagicZone_Area_Slowness

Dragon_Mark_TM_MagicZone_Blindness:
